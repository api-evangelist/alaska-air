naftiko: 1.0.0-alpha2
info:
  label: Alaska Airlines Flight Schedules API — Schedules
  description: 'Alaska Airlines Flight Schedules API — Schedules. 1 operations. Lead operation: Alaska Airlines Get Flight
    Schedules. Self-contained Naftiko capability covering one Alaska Air business surface.'
  tags:
  - Alaska Air
  - Schedules
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ALASKA_AIR_API_KEY: ALASKA_AIR_API_KEY
capability:
  consumes:
  - type: http
    namespace: flight-schedules-schedules
    baseUri: https://api.alaskaair.com/v1
    description: Alaska Airlines Flight Schedules API — Schedules business capability. Self-contained, no shared references.
    resources:
    - name: schedules
      path: /schedules
      operations:
      - name: getschedules
        method: GET
        description: Alaska Airlines Get Flight Schedules
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: origin
          in: query
          type: string
          description: IATA origin airport code
          required: true
        - name: destination
          in: query
          type: string
          description: IATA destination airport code
          required: true
        - name: departureDate
          in: query
          type: string
          description: Departure date in YYYY-MM-DD format
          required: true
        - name: returnDate
          in: query
          type: string
          description: Return date for round-trip schedule queries (YYYY-MM-DD)
        - name: carrier
          in: query
          type: string
          description: Carrier filter (AS for Alaska, QX for Horizon)
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_AIR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: flight-schedules-schedules-rest
    port: 8080
    description: REST adapter for Alaska Airlines Flight Schedules API — Schedules. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/schedules
      name: schedules
      description: REST surface for schedules.
      operations:
      - method: GET
        name: getschedules
        description: Alaska Airlines Get Flight Schedules
        call: flight-schedules-schedules.getschedules
        with:
          origin: rest.origin
          destination: rest.destination
          departureDate: rest.departureDate
          returnDate: rest.returnDate
          carrier: rest.carrier
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: flight-schedules-schedules-mcp
    port: 9090
    transport: http
    description: MCP adapter for Alaska Airlines Flight Schedules API — Schedules. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: alaska-airlines-get-flight-schedules
      description: Alaska Airlines Get Flight Schedules
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flight-schedules-schedules.getschedules
      with:
        origin: tools.origin
        destination: tools.destination
        departureDate: tools.departureDate
        returnDate: tools.returnDate
        carrier: tools.carrier
      outputParameters:
      - type: object
        mapping: $.
