naftiko: 1.0.0-alpha2
info:
  label: Alaska Airlines Travel Operations
  description: Workflow capability combining Alaska Airlines Flight Status and Cargo APIs for travel operations management.
    Enables travel agents, corporate travel managers, and freight forwarders to track flights, monitor cargo shipments, and
    get rate estimates in a unified interface.
  tags:
  - Alaska Airlines
  - Travel Operations
  - Aviation
  - Cargo
  - Flight Status
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ALASKA_API_KEY: ALASKA_API_KEY
    ALASKA_CARGO_API_KEY: ALASKA_CARGO_API_KEY
capability:
  consumes:
  - type: http
    namespace: alaska-flight-status
    baseUri: https://api.alaskaair.com/v1
    description: Alaska Airlines Flight Status API
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_API_KEY}}'
      placement: header
    resources:
    - name: flights
      path: /flights
      description: Flight status by route
      operations:
      - name: list-flights
        method: GET
        description: List flights for a route and date
        inputParameters:
        - name: originAirport
          in: query
          type: string
          required: true
          description: IATA origin airport code
        - name: destinationAirport
          in: query
          type: string
          required: true
          description: IATA destination airport code
        - name: flightDate
          in: query
          type: string
          required: true
          description: Flight date (YYYY-MM-DD)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: flight-status
      path: /flights/{flightNumber}/status
      description: Individual flight status
      operations:
      - name: get-flight-status
        method: GET
        description: Get real-time status for a specific flight
        inputParameters:
        - name: flightNumber
          in: path
          type: string
          required: true
          description: Alaska Airlines flight number
        - name: flightDate
          in: query
          type: string
          required: true
          description: Flight date (YYYY-MM-DD)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  - type: http
    namespace: alaska-cargo
    baseUri: https://api.alaskacargo.com/v1
    description: Alaska Air Cargo API
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_CARGO_API_KEY}}'
      placement: header
    resources:
    - name: shipments
      path: /shipments
      description: Cargo shipment booking and listing
      operations:
      - name: create-shipment
        method: POST
        description: Book a new cargo shipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            origin: '{{tools.origin}}'
            destination: '{{tools.destination}}'
            shipDate: '{{tools.shipDate}}'
            weight: '{{tools.weight}}'
            pieces: '{{tools.pieces}}'
      - name: list-shipments
        method: GET
        description: List cargo shipments
        inputParameters:
        - name: status
          in: query
          type: string
          required: false
          description: Status filter
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: shipment-tracking
      path: /shipments/{awbNumber}
      description: Shipment tracking by AWB
      operations:
      - name: get-shipment
        method: GET
        description: Get shipment tracking details
        inputParameters:
        - name: awbNumber
          in: path
          type: string
          required: true
          description: Air Waybill number
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: rates
      path: /rates
      description: Cargo rate estimation
      operations:
      - name: get-rate-estimate
        method: POST
        description: Get cargo rate estimate
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        body:
          type: json
          data:
            origin: '{{tools.origin}}'
            destination: '{{tools.destination}}'
            weight: '{{tools.weight}}'
  exposes:
  - type: rest
    port: 8080
    namespace: alaska-travel-ops-api
    description: Unified REST API for Alaska Airlines travel operations.
    resources:
    - path: /v1/flights
      name: flights
      description: Flight status and scheduling
      operations:
      - method: GET
        name: list-flights
        description: List Alaska Airlines flights by route and date
        call: alaska-flight-status.list-flights
        with:
          originAirport: rest.originAirport
          destinationAirport: rest.destinationAirport
          flightDate: rest.flightDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/flights/{flightNumber}/status
      name: flight-status
      description: Real-time flight status
      operations:
      - method: GET
        name: get-flight-status
        description: Get real-time status for a specific flight
        call: alaska-flight-status.get-flight-status
        with:
          flightNumber: rest.flightNumber
          flightDate: rest.flightDate
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cargo/shipments
      name: cargo-shipments
      description: Cargo shipment booking and listing
      operations:
      - method: GET
        name: list-cargo-shipments
        description: List cargo shipments
        call: alaska-cargo.list-shipments
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: book-cargo-shipment
        description: Book a new cargo shipment
        call: alaska-cargo.create-shipment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cargo/shipments/{awbNumber}
      name: cargo-tracking
      description: Cargo shipment tracking
      operations:
      - method: GET
        name: track-cargo-shipment
        description: Track cargo shipment by AWB number
        call: alaska-cargo.get-shipment
        with:
          awbNumber: rest.awbNumber
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/cargo/rates
      name: cargo-rates
      description: Cargo rate estimation
      operations:
      - method: POST
        name: get-cargo-rate
        description: Get cargo rate estimate
        call: alaska-cargo.get-rate-estimate
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: alaska-travel-ops-mcp
    transport: http
    description: MCP server for AI-assisted Alaska Airlines travel operations.
    tools:
    - name: list-alaska-flights
      description: List Alaska Airlines flights for a specific route and date with real-time status, delays, and gate assignments.
      hints:
        readOnly: true
        openWorld: false
      call: alaska-flight-status.list-flights
      with:
        originAirport: tools.originAirport
        destinationAirport: tools.destinationAirport
        flightDate: tools.flightDate
      outputParameters:
      - type: object
        mapping: $.
    - name: get-alaska-flight-status
      description: Get real-time status for a specific Alaska Airlines flight including departure/arrival times, gate, and
        delay information.
      hints:
        readOnly: true
        openWorld: false
      call: alaska-flight-status.get-flight-status
      with:
        flightNumber: tools.flightNumber
        flightDate: tools.flightDate
      outputParameters:
      - type: object
        mapping: $.
    - name: get-cargo-rate-estimate
      description: Get rate estimate for Alaska Air Cargo shipment based on origin, destination, weight, and number of pieces.
      hints:
        readOnly: true
        openWorld: false
      call: alaska-cargo.get-rate-estimate
      with:
        origin: tools.origin
        destination: tools.destination
        weight: tools.weight
        pieces: tools.pieces
      outputParameters:
      - type: object
        mapping: $.
    - name: book-cargo-shipment
      description: Book a new Alaska Air Cargo shipment to 115+ destinations worldwide
      hints:
        readOnly: false
        openWorld: false
      call: alaska-cargo.create-shipment
      with:
        origin: tools.origin
        destination: tools.destination
        shipDate: tools.shipDate
        weight: tools.weight
        pieces: tools.pieces
        commodity: tools.commodity
      outputParameters:
      - type: object
        mapping: $.
    - name: track-cargo-shipment
      description: Track Alaska Air Cargo shipment by Air Waybill number with event history
      hints:
        readOnly: true
        openWorld: false
      call: alaska-cargo.get-shipment
      with:
        awbNumber: tools.awbNumber
      outputParameters:
      - type: object
        mapping: $.
