naftiko: 1.0.0-alpha2
info:
  label: Alaska Airlines Flight Status API — Flight Status
  description: 'Alaska Airlines Flight Status API — Flight Status. 2 operations. Lead operation: Alaska Airlines List Flights
    by Route. Self-contained Naftiko capability covering one Alaska Air business surface.'
  tags:
  - Alaska Air
  - Flight Status
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ALASKA_AIR_API_KEY: ALASKA_AIR_API_KEY
capability:
  consumes:
  - type: http
    namespace: flight-status-flight-status
    baseUri: https://api.alaskaair.com/v1
    description: Alaska Airlines Flight Status API — Flight Status business capability. Self-contained, no shared references.
    resources:
    - name: flights
      path: /flights
      operations:
      - name: listflights
        method: GET
        description: Alaska Airlines List Flights by Route
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: originAirport
          in: query
          type: string
          description: IATA code for origin airport
          required: true
        - name: destinationAirport
          in: query
          type: string
          description: IATA code for destination airport
          required: true
        - name: flightDate
          in: query
          type: string
          description: Flight date in YYYY-MM-DD format
          required: true
        - name: carrier
          in: query
          type: string
          description: Carrier code filter (AS for Alaska, QX for Horizon)
    - name: flights-flightNumber-status
      path: /flights/{flightNumber}/status
      operations:
      - name: getflightstatus
        method: GET
        description: Alaska Airlines Get Flight Status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: flightNumber
          in: path
          type: string
          description: Alaska Airlines flight number (e.g., AS123)
          required: true
        - name: flightDate
          in: query
          type: string
          description: Flight date in YYYY-MM-DD format
          required: true
        - name: originAirport
          in: query
          type: string
          description: IATA code for origin airport
        - name: destinationAirport
          in: query
          type: string
          description: IATA code for destination airport
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_AIR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: flight-status-flight-status-rest
    port: 8080
    description: REST adapter for Alaska Airlines Flight Status API — Flight Status. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/flights
      name: flights
      description: REST surface for flights.
      operations:
      - method: GET
        name: listflights
        description: Alaska Airlines List Flights by Route
        call: flight-status-flight-status.listflights
        with:
          originAirport: rest.originAirport
          destinationAirport: rest.destinationAirport
          flightDate: rest.flightDate
          carrier: rest.carrier
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/flights/{flightnumber}/status
      name: flights-flightnumber-status
      description: REST surface for flights-flightNumber-status.
      operations:
      - method: GET
        name: getflightstatus
        description: Alaska Airlines Get Flight Status
        call: flight-status-flight-status.getflightstatus
        with:
          flightNumber: rest.flightNumber
          flightDate: rest.flightDate
          originAirport: rest.originAirport
          destinationAirport: rest.destinationAirport
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: flight-status-flight-status-mcp
    port: 9090
    transport: http
    description: MCP adapter for Alaska Airlines Flight Status API — Flight Status. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: alaska-airlines-list-flights-route
      description: Alaska Airlines List Flights by Route
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flight-status-flight-status.listflights
      with:
        originAirport: tools.originAirport
        destinationAirport: tools.destinationAirport
        flightDate: tools.flightDate
        carrier: tools.carrier
      outputParameters:
      - type: object
        mapping: $.
    - name: alaska-airlines-get-flight-status
      description: Alaska Airlines Get Flight Status
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flight-status-flight-status.getflightstatus
      with:
        flightNumber: tools.flightNumber
        flightDate: tools.flightDate
        originAirport: tools.originAirport
        destinationAirport: tools.destinationAirport
      outputParameters:
      - type: object
        mapping: $.
