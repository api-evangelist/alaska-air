naftiko: "1.0.0-alpha1"

info:
  label: Alaska Airlines Flight Status API
  description: >-
    Shared capability definition for the Alaska Airlines Flight Status API
    providing real-time flight tracking, departure/arrival information,
    and gate assignments.
  tags:
    - Alaska Airlines
    - Flight Status
    - Aviation
    - Travel
  created: "2026-04-19"
  modified: "2026-04-19"

binds:
  - namespace: env
    keys:
      ALASKA_API_KEY: ALASKA_API_KEY

capability:
  consumes:
    - type: http
      namespace: alaska-flight-status
      baseUri: "https://api.alaskaair.com/v1"
      description: Alaska Airlines Flight Status API
      authentication:
        type: apikey
        key: Ocp-Apim-Subscription-Key
        value: "{{env.ALASKA_API_KEY}}"
        placement: header
      resources:
        - name: flights
          path: /flights
          description: Flight status by route
          operations:
            - name: list-flights
              method: GET
              description: List flights for a route and date
              inputParameters:
                - name: originAirport
                  in: query
                  type: string
                  required: true
                  description: IATA origin airport code
                - name: destinationAirport
                  in: query
                  type: string
                  required: true
                  description: IATA destination airport code
                - name: flightDate
                  in: query
                  type: string
                  required: true
                  description: Flight date (YYYY-MM-DD)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
        - name: flight-status
          path: /flights/{flightNumber}/status
          description: Individual flight status
          operations:
            - name: get-flight-status
              method: GET
              description: Get real-time status for a specific flight
              inputParameters:
                - name: flightNumber
                  in: path
                  type: string
                  required: true
                  description: Alaska Airlines flight number
                - name: flightDate
                  in: query
                  type: string
                  required: true
                  description: Flight date (YYYY-MM-DD)
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: alaska-flight-status-api
      resources:
        - path: /v1/flights
          name: flights
          description: Flight status data
          operations:
            - method: GET
              name: list-flights
              description: List Alaska Airlines flights by route
              call: "alaska-flight-status.list-flights"
              with:
                originAirport: "rest.originAirport"
                destinationAirport: "rest.destinationAirport"
                flightDate: "rest.flightDate"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: alaska-flight-status-mcp
      transport: http
      tools:
        - name: list-flights
          description: List Alaska Airlines flights for a route and date with status information
          hints:
            readOnly: true
            openWorld: false
          call: "alaska-flight-status.list-flights"
          with:
            originAirport: "tools.originAirport"
            destinationAirport: "tools.destinationAirport"
            flightDate: "tools.flightDate"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-flight-status
          description: Get real-time status for a specific Alaska Airlines flight
          hints:
            readOnly: true
            openWorld: false
          call: "alaska-flight-status.get-flight-status"
          with:
            flightNumber: "tools.flightNumber"
            flightDate: "tools.flightDate"
          outputParameters:
            - type: object
              mapping: "$."
