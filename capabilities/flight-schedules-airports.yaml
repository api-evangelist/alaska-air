naftiko: 1.0.0-alpha2
info:
  label: Alaska Airlines Flight Schedules API — Airports
  description: 'Alaska Airlines Flight Schedules API — Airports. 1 operations. Lead operation: Alaska Airlines List Airports.
    Self-contained Naftiko capability covering one Alaska Air business surface.'
  tags:
  - Alaska Air
  - Airports
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ALASKA_AIR_API_KEY: ALASKA_AIR_API_KEY
capability:
  consumes:
  - type: http
    namespace: flight-schedules-airports
    baseUri: https://api.alaskaair.com/v1
    description: Alaska Airlines Flight Schedules API — Airports business capability. Self-contained, no shared references.
    resources:
    - name: airports
      path: /airports
      operations:
      - name: listairports
        method: GET
        description: Alaska Airlines List Airports
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: country
          in: query
          type: string
          description: Filter airports by ISO country code
        - name: state
          in: query
          type: string
          description: Filter airports by US state code
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_AIR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: flight-schedules-airports-rest
    port: 8080
    description: REST adapter for Alaska Airlines Flight Schedules API — Airports. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/airports
      name: airports
      description: REST surface for airports.
      operations:
      - method: GET
        name: listairports
        description: Alaska Airlines List Airports
        call: flight-schedules-airports.listairports
        with:
          country: rest.country
          state: rest.state
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: flight-schedules-airports-mcp
    port: 9090
    transport: http
    description: MCP adapter for Alaska Airlines Flight Schedules API — Airports. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: alaska-airlines-list-airports
      description: Alaska Airlines List Airports
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: flight-schedules-airports.listairports
      with:
        country: tools.country
        state: tools.state
      outputParameters:
      - type: object
        mapping: $.
