naftiko: 1.0.0-alpha2
info:
  label: Alaska Air Cargo API — Shipments
  description: 'Alaska Air Cargo API — Shipments. 3 operations. Lead operation: Alaska Air Cargo Create Shipment. Self-contained
    Naftiko capability covering one Alaska Air business surface.'
  tags:
  - Alaska Air
  - Shipments
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    ALASKA_AIR_API_KEY: ALASKA_AIR_API_KEY
capability:
  consumes:
  - type: http
    namespace: cargo-shipments
    baseUri: https://api.alaskacargo.com/v1
    description: Alaska Air Cargo API — Shipments business capability. Self-contained, no shared references.
    resources:
    - name: shipments
      path: /shipments
      operations:
      - name: createshipment
        method: POST
        description: Alaska Air Cargo Create Shipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listshipments
        method: GET
        description: Alaska Air Cargo List Shipments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: fromDate
          in: query
          type: string
          description: Start date filter (YYYY-MM-DD)
        - name: toDate
          in: query
          type: string
          description: End date filter (YYYY-MM-DD)
        - name: status
          in: query
          type: string
          description: Filter by shipment status
    - name: shipments-awbNumber
      path: /shipments/{awbNumber}
      operations:
      - name: getshipment
        method: GET
        description: Alaska Air Cargo Get Shipment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: awbNumber
          in: path
          type: string
          description: Air Waybill number (e.g., 027-12345678)
          required: true
    authentication:
      type: apikey
      key: Ocp-Apim-Subscription-Key
      value: '{{env.ALASKA_AIR_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cargo-shipments-rest
    port: 8080
    description: REST adapter for Alaska Air Cargo API — Shipments. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/shipments
      name: shipments
      description: REST surface for shipments.
      operations:
      - method: POST
        name: createshipment
        description: Alaska Air Cargo Create Shipment
        call: cargo-shipments.createshipment
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listshipments
        description: Alaska Air Cargo List Shipments
        call: cargo-shipments.listshipments
        with:
          fromDate: rest.fromDate
          toDate: rest.toDate
          status: rest.status
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/shipments/{awbnumber}
      name: shipments-awbnumber
      description: REST surface for shipments-awbNumber.
      operations:
      - method: GET
        name: getshipment
        description: Alaska Air Cargo Get Shipment
        call: cargo-shipments.getshipment
        with:
          awbNumber: rest.awbNumber
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cargo-shipments-mcp
    port: 9090
    transport: http
    description: MCP adapter for Alaska Air Cargo API — Shipments. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: alaska-air-cargo-create-shipment
      description: Alaska Air Cargo Create Shipment
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: cargo-shipments.createshipment
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: alaska-air-cargo-list-shipments
      description: Alaska Air Cargo List Shipments
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cargo-shipments.listshipments
      with:
        fromDate: tools.fromDate
        toDate: tools.toDate
        status: tools.status
      outputParameters:
      - type: object
        mapping: $.
    - name: alaska-air-cargo-get-shipment
      description: Alaska Air Cargo Get Shipment
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cargo-shipments.getshipment
      with:
        awbNumber: tools.awbNumber
      outputParameters:
      - type: object
        mapping: $.
