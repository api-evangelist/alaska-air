  - type: Features
    data:
    - name: Real-Time Flight Status
      description: Track live flight status, departure and arrival times, gate assignments, and delay information for Alaska
        Airlines and Horizon Air flights.
    - name: Flight Schedules
      description: Access flight schedule data including routes, operating days, departure/arrival times, and equipment across
        the Alaska network.
    - name: Cargo Booking and Tracking
      description: Book shipments and track cargo across 115+ destinations worldwide via Alaska Air Cargo's network, including
        dedicated widebody aircraft.
    - name: Cargo Rate Estimates
      description: Get real-time rate estimates for cargo shipments based on origin, destination, weight, dimensions, and special
        handling requirements.
    - name: Mileage Plan Partner Integration
      description: Enable partner mile accrual and redemption for Alaska's Mileage Plan loyalty program across airline, hotel,
        car rental, and retail partners.
    - name: Dedicated Cargo Aircraft
      description: Alaska Air Cargo operates the only U.S. passenger airline with dedicated cargo aircraft (Airbus A330s and
        Boeing 787s) for increased capacity on key routes.
    - name: Specialized Cargo Services
      description: Support for dangerous goods transport, live animal shipments via Pet Connect, and international cargo across
        Asia, Pacific, Canada, and Mexico.
    - name: API Management via Azure
      description: Developer portal powered by Microsoft Azure API Management with subscription-based key management, interactive
        API console, and automatic API documentation generation.
  - type: UseCases
    data:
    - name: Travel Agent and OTA Integration
      description: Integrate Alaska Airlines flight schedules and status into online travel agencies and booking platforms for
        real-time availability and status updates.
    - name: Cargo Partner Booking
      description: Enable freight forwarders and cargo brokers to book shipments, get rate quotes, and track Alaska Air Cargo
        shipments programmatically.
    - name: Loyalty Partner Mile Reporting
      description: Integrate Mileage Plan mile accrual into partner platforms (hotels, car rentals, credit cards) to automatically
        report earned miles.
    - name: Airport Operations Display
      description: Power airport operations systems and display boards with real-time Alaska Airlines flight status and gate
        assignment data.
    - name: Corporate Travel Management
      description: Integrate Alaska Airlines flight data into corporate travel management systems for booking, tracking, and
        expense reporting.
    - name: Mobile App Integration
      description: Embed Alaska Airlines flight status and schedule data into third-party mobile applications for travelers.
  - type: Integrations
    data:
    - name: Microsoft Azure API Management
      description: Developer portal and API gateway powered by Azure API Management with subscription key management and interactive
        testing console.
    - name: Hawaiian Airlines
      description: Alaska Air Cargo partnerships including connections with Hawaiian Airlines cargo network for Pacific and
        inter-island routes.
    - name: One World Alliance
      description: Member of the oneworld airline alliance enabling Mileage Plan accrual and redemption across 13 member airlines.
    - name: Duffel
      description: Third-party travel API provider enabling search, booking, and ticket issuance for Alaska Airlines flights.
    - name: Five9
      description: Customer service platform integration for Alaska Air Cargo live chat and support operations.
