specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Alaska Airlines
providerId: alaska-air
publisherName: Alaska Airlines, Inc.
serviceCategory: Travel & Transportation
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Airlines
  - Aviation
  - Travel
  - Cargo
  - Loyalty
  - Flight Status
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps shell for Alaska Airlines APIs: no public commercial surface - cost
  is determined by partner / GDS / NDC / cargo / loyalty contracts. Reconcile against the specific commercial
  agreement covering each integration.'
sources:
  - https://www.alaskaair.com
  - https://www.alaskacargo.com
  - https://focus.finops.org/focus-specification/v1-3/
billingModel:
  pricingCategory: Subscription
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Alaska Airlines APIs
  ServiceCategory: Travel & Transportation
  ProviderName: Alaska Airlines
  PublisherName: Alaska Airlines, Inc.
  InvoiceIssuerName: Alaska Airlines, Inc.
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: partner_contract
    description: Annual partner agreement value for API channel access
    unit: contract-year
    aggregation: sum
    dimensions:
      - channel
      - product
  - name: api_calls
    description: API call volume across distribution / cargo / loyalty endpoints (where contractually
      metered)
    unit: request
    aggregation: sum
    dimensions:
      - api
      - channel
principles:
  - name: Visibility
    description: Track Alaska partner-channel costs through the partner-management billing relationship;
      no public usage telemetry is available.
  - name: Allocation
    description: Allocate channel contract costs to the consuming product line (corporate booking, GDS
      distribution, cargo, loyalty integration).
  - name: Optimization
    description: Right-size partner integrations during annual renewals; deprecate unused channels; consolidate
      where possible.
  - name: Accountability
    description: Owned by the partner-integration / distribution leads on the consuming side; reviewed
      against fare / cargo revenue contribution.
maintainers:
