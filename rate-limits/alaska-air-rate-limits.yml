specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Alaska Airlines
providerId: alaska-air
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Airlines
  - Aviation
  - Travel
  - Cargo
  - Loyalty
  - Flight Status
  - Rate Limiting
description: Alaska Airlines APIs are not publicly published; rate-limit behavior is therefore defined
  inside each partner agreement (GDS, NDC, cargo, loyalty). No public throttling documentation exists.
sources:
  - https://www.alaskaair.com
  - https://www.alaskacargo.com
notes: No public rate-limit documentation. Reconcile against the partner-specific contractual rate-limit
  schedule when known.
responseCodes:
  throttled: 429
limits:
  - name: Partner-Negotiated Throughput
    scope: contract
    metric: varies
    limit: per-contract; not publicly documented
policies:
  - name: Contractual Limits
    description: Throughput is dimensioned per partner agreement and managed by Alaska's distribution and
      cargo teams.
  - name: Backoff Strategy
    description: Clients should implement exponential backoff with jitter and honor any Retry-After header
      returned.
maintainers:
